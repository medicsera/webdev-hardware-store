server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml+rss;
    gzip_min_length 1024;
    gzip_vary on;

    # Security headers (applied to all responses without their own add_header block)
    add_header X-Content-Type-Options  "nosniff"          always;
    add_header X-Frame-Options         "DENY"             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # SPA — все неизвестные маршруты отдаём index.html (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Долгосрочное кеширование хешированных ассетов (JS/CSS/изображения)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control        "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    client_max_body_size 50m;

    # Проксируем /api/* → backend:8080/* (стрипаем /api)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization    $http_authorization;
        proxy_set_header Connection       "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Проксируем /uploads/* → backend:8080/uploads/* (загруженные файлы)
    # ^~ даёт приоритет над regex-блоком статических ассетов (png/jpg/etc)
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header Connection       "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        add_header Cache-Control        "public";
        add_header X-Content-Type-Options "nosniff" always;
        expires 7d;
    }
}
