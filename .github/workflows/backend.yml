name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'pom.xml'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'pom.xml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -pl backend test
        env:
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long-for-hs256
          ADMIN_USERNAME: admin@store.ru
          ADMIN_PASSWORD: ci-admin-password
          DB_USER: test
          DB_PASS: test
          DB_NAME: hardware_store_test
