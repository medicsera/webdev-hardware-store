spring:
  application:
    name: webdev-hardware-store

  datasource:
    url: jdbc:postgresql://localhost:5432/hardware_store
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}

admin:
  username: ${ADMIN_USERNAME:admin@store.ru}
  password: ${ADMIN_PASSWORD}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
